<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h2>Flexbox-based Navigation Layout</h2>
    <p>Using <code>d-flex</code>, <code>flex-column</code>, and <code>flex-md-row</code> to make navigation links display as a vertical stack on mobile and horizontal row on larger displays.</p>
    
    <nav class="d-flex flex-column flex-md-row justify-content-between align-items-center bg-light border p-3">
      <a class="navbar-brand fw-bold text-primary mb-2 mb-md-0" href="#">Community Portal</a>
      <div class="d-flex flex-column flex-md-row gap-3">
        <a class="nav-link text-dark" href="#">Home</a>
        <a class="nav-link text-dark" href="#">Events</a>
        <a class="nav-link text-dark" href="#">Contact</a>
      </div>
    </nav>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
