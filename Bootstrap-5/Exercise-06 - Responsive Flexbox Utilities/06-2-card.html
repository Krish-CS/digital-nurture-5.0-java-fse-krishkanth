<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox Card Alignment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h2>Card Layout with Flexbox Alignment</h2>
    <p>Using <code>justify-content-between</code> and <code>align-items-center</code> to distribute button and text inside a card layout.</p>
    
    <div class="card p-3" style="max-width: 500px;">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h5 class="mb-0">Web Development Workshop</h5>
          <small class="text-muted">Seats: 15 left</small>
        </div>
        <button class="btn btn-primary">Register Now</button>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
