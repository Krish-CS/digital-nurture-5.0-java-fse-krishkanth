<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Centered Row Content</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Inline styles only for custom height of demonstrating block alignment */
    .custom-row {
      height: 200px;
    }
  </style>
</head>
<body class="p-3">
  <div class="container">
    <h2>Alignment inside a Row</h2>
    <p>Using <code>justify-content-center</code> and <code>align-items-center</code> to align and center grid columns inside a row container.</p>
    
    <div class="row justify-content-center align-items-center bg-light border custom-row">
      <div class="col-4 p-3 bg-secondary text-white text-center border">
        Centered Box
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
