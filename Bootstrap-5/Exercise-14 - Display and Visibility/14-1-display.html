<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Display Utilities</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h2>Display Utilities</h2>
    <p>Resize the window to observe columns dynamically showing, hiding, or changing structure:</p>
    
    <!-- Hidden on mobile, block on tablet+ -->
    <div class="alert alert-info d-none d-md-block">
      <strong>Tablet/Desktop Banner:</strong> This notification is only visible on medium viewports and larger.
    </div>
    
    <!-- Block on mobile/tablet, flex on desktop+ -->
    <div class="d-block d-lg-flex border bg-light p-3 justify-content-between align-items-center">
      <div>
        <h5 class="mb-0">Bootcamp Session #3</h5>
        <p class="mb-2 mb-lg-0 text-muted">Learn grid structures</p>
      </div>
      <button class="btn btn-primary">Join Session</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
