<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tabbed Navigation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h2>Tabbed Navigation Layouts</h2>
    
    <div class="mb-5">
      <h5>Nav Tabs</h5>
      <ul class="nav nav-tabs">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Active Tab</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Tab Link 1</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Tab Link 2</a>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true">Disabled Tab</a>
        </li>
      </ul>
    </div>
    
    <div>
      <h5>Nav Pills</h5>
      <ul class="nav nav-pills">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Active Pill</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Pill Link 1</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Pill Link 2</a>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true">Disabled Pill</a>
        </li>
      </ul>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
