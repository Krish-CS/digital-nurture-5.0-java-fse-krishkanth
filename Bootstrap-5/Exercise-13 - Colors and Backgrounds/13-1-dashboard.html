<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard Colors</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h2>Portal Analytics Dashboard</h2>
    <p>Using contextual background classes and matching text colors to format data blocks:</p>
    
    <div class="row text-white text-center">
      <!-- Active Events -->
      <div class="col-md-3 mb-3">
        <div class="p-4 bg-primary rounded shadow-sm">
          <h3>14</h3>
          <p class="mb-0">Active Events</p>
        </div>
      </div>
      
      <!-- Completed Events -->
      <div class="col-md-3 mb-3">
        <div class="p-4 bg-success rounded shadow-sm">
          <h3>280</h3>
          <p class="mb-0">Completed Registrations</p>
        </div>
      </div>
      
      <!-- Critical Notifications -->
      <div class="col-md-3 mb-3">
        <div class="p-4 bg-warning text-dark rounded shadow-sm">
          <h3>3</h3>
          <p class="mb-0">Pending Reviews</p>
        </div>
      </div>
      
      <!-- Cancelled Events -->
      <div class="col-md-3 mb-3">
        <div class="p-4 bg-danger rounded shadow-sm">
          <h3>1</h3>
          <p class="mb-0">Cancelled Sessions</p>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
