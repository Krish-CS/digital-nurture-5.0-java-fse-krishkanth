<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Card Shadows and Capsule Styling</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3 bg-light">
  <div class="container" style="max-width: 600px;">
    <h2>Box Shadows &amp; Rounded Pills</h2>
    <p>Demonstrating depth and capsule outlines on components:</p>
    
    <div class="row">
      <!-- Standard Shadow Card -->
      <div class="col-md-6 mb-4">
        <div class="card p-3 shadow border-0">
          <h5>Card Shadow Sm</h5>
          <p class="text-muted">A subtle, slight depth card container.</p>
          <button class="btn btn-primary rounded-pill">Capsule Btn</button>
        </div>
      </div>
      
      <!-- Large Shadow Card -->
      <div class="col-md-6 mb-4">
        <div class="card p-3 shadow-lg border-0">
          <h5>Card Shadow Large</h5>
          <p class="text-muted">A deep, prominent drop shadow container.</p>
          <button class="btn btn-success rounded-pill">Capsule Btn</button>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
