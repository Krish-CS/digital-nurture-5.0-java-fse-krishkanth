<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Borders and Circular Images</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container text-center">
    <h2>Borders &amp; Rounding Utilities</h2>
    <p>Using border thickness, contextual border coloring, and circle rounding on images:</p>
    
    <div class="mt-4">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&h=200&q=80" class="border border-primary border-3 rounded-circle" alt="Circular Profile image">
      <p class="mt-3 text-muted">Avatar styled with: <code>border border-primary border-3 rounded-circle</code></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
