<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3 bg-light">
  <div class="container py-5">
    <div class="text-center mb-5">
      <h2 class="display-5">Pricing Section</h2>
      <p class="lead">Simple, clean layouts with deliberate spacing to improve visual scanning.</p>
    </div>
    
    <div class="row justify-content-center text-center">
      <!-- Standard Plan -->
      <div class="col-md-4 mb-4">
        <div class="card shadow-sm p-4 h-100">
          <div class="card-body py-4">
            <h4 class="fw-bold">Standard</h4>
            <h1 class="card-title pricing-card-title my-4">$9<small class="text-muted fw-light">/mo</small></h1>
            <ul class="list-unstyled mt-3 mb-4">
              <li class="py-1">Access to local events</li>
              <li class="py-1">Email confirmations</li>
              <li class="py-1">Support access</li>
            </ul>
            <button type="button" class="w-100 btn btn-lg btn-outline-primary">Choose Plan</button>
          </div>
        </div>
      </div>
      
      <!-- Premium Plan -->
      <div class="col-md-4 mb-4">
        <div class="card shadow p-4 h-100 border-primary">
          <div class="card-body py-4">
            <h4 class="fw-bold text-primary">Premium</h4>
            <h1 class="card-title pricing-card-title my-4">$29<small class="text-muted fw-light">/mo</small></h1>
            <ul class="list-unstyled mt-3 mb-4">
              <li class="py-1">Priority registrations</li>
              <li class="py-1">Reserved speaker seats</li>
              <li class="py-1">24/7 dedicated support</li>
            </ul>
            <button type="button" class="w-100 btn btn-lg btn-primary">Choose Plan</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
