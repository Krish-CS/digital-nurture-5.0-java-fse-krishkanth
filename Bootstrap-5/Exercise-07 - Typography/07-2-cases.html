<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text Case Transformations</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h2>Text Transformations</h2>
    <p>Demonstrating case transformations in Bootstrap 5:</p>
    
    <div class="border p-3 bg-light">
      <p class="text-uppercase">this text is transformed to uppercase.</p>
      <p class="text-lowercase">THIS TEXT IS TRANSFORMED TO LOWERCASE.</p>
      <p class="text-capitalize">this text capitalized each word's first letter.</p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
