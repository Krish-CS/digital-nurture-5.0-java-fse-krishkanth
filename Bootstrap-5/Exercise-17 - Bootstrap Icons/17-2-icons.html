<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Icon-Only Buttons</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body class="p-3">
  <div class="container">
    <h2>Icon-Only Control Buttons</h2>
    <p>Replacing traditional textual buttons with descriptive, space-saving icon triggers:</p>
    
    <div class="d-flex gap-2">
      <button class="btn btn-outline-primary" title="Edit Item">
        <i class="bi bi-pencil-fill"></i>
      </button>

      <button class="btn btn-outline-danger" title="Delete Item">
        <i class="bi bi-trash3-fill"></i>
      </button>

      <button class="btn btn-outline-warning" title="Bookmark Item">
        <i class="bi bi-bookmark-star-fill"></i>
      </button>

      <button class="btn btn-outline-success" title="Share Item">
        <i class="bi bi-share-fill"></i>
      </button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
