<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixed Footer Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* Add scroll height to demonstrate the footer remaining sticky */
    .spacer {
      height: 1000px;
    }
  </style>
</head>
<body class="p-3">
  <div class="container">
    <h2>Sticky / Fixed Position Footer</h2>
    <p>Scroll down to see the footer remain locked at the bottom of the screen regardless of user scrolling.</p>
    
    <div class="spacer border p-3 my-4 bg-light">
      <p>Scrollable placeholder content...</p>
    </div>
  </div>

  <!-- Fixed bottom footer -->
  <footer class="position-fixed bottom-0 start-0 w-100 bg-dark text-white text-center py-3">
    <div class="container">
      <span class="mb-0">&copy; 2026 City Council Portal. All rights reserved.</span>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
