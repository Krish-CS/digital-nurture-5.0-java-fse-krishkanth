<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Badge Overlay Layout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container text-center">
    <h2>Badge Image Overlays</h2>
    <p>Using <code>position-relative</code> and <code>position-absolute</code> to overlap notifications on images:</p>
    
    <div class="mt-4 d-inline-block position-relative">
      <!-- Base element -->
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&h=150&q=80" class="rounded border" alt="Profile avatar">
      
      <!-- Overlay Badge -->
      <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
        9+
        <span class="visually-hidden">unread messages</span>
      </span>
    </div>
    
    <p class="mt-3 text-muted">A notification counter badge overlaying the avatar's top-right corner.</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
