<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Registration Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container" style="max-width: 600px;">
    <h2>Registration Form</h2>
    <form>
      <!-- Input Group for username prefix -->
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <div class="input-group">
          <span class="input-group-text" id="basic-addon1">@</span>
          <input type="text" class="form-control" id="username" placeholder="johndoe" aria-describedby="basic-addon1" required>
        </div>
      </div>
      
      <!-- Standard Input -->
      <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
      </div>
      
      <!-- Selection field -->
      <div class="mb-3">
        <label for="eventSelect" class="form-label">Select Event</label>
        <select class="form-select" id="eventSelect" required>
          <option value="" selected disabled>Choose an event...</option>
          <option value="tech">Tech Innovators Meetup</option>
          <option value="ai">AI & ML Conference</option>
          <option value="web">Frontend Bootcamp</option>
        </select>
      </div>

      <!-- Checkboxes -->
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="termsCheck" required>
        <label class="form-check-label" for="termsCheck">I agree to the terms and conditions</label>
      </div>
      
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
