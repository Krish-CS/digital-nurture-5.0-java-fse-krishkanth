<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Profile Card</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container d-flex justify-content-center">
    <!-- Card container -->
    <div class="card" style="width: 18rem;">
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&h=150&q=80" class="card-img-top" alt="User avatar">
      <div class="card-body">
        <h5 class="card-title">Alice Johnson</h5>
        <h6 class="card-subtitle mb-2 text-muted">Event Organizer</h6>
        <p class="card-text">Alice is a developer lead from New York and manages our technology meetup registrations.</p>
        <a href="#" class="btn btn-primary">View Profile</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
