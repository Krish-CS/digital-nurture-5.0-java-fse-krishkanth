<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Four Column Grid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h2>Four Column Layout</h2>
    <div class="row">
      <div class="col-sm-3 mb-3">
        <div class="p-3 bg-light border text-center">
          <h5>Column 1</h5>
          <p>This is the first column content block.</p>
        </div>
      </div>
      <div class="col-sm-3 mb-3">
        <div class="p-3 bg-light border text-center">
          <h5>Column 2</h5>
          <p>This is the second column content block.</p>
        </div>
      </div>
      <div class="col-sm-3 mb-3">
        <div class="p-3 bg-light border text-center">
          <h5>Column 3</h5>
          <p>This is the third column content block.</p>
        </div>
      </div>
      <div class="col-sm-3 mb-3">
        <div class="p-3 bg-light border text-center">
          <h5>Column 4</h5>
          <p>This is the fourth column content block.</p>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
