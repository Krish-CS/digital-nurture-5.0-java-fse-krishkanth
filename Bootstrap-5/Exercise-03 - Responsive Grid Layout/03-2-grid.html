<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>03-2 - Grid Classes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
  <div class="container">
    <h2>Grid Classes in Use</h2>
    <p>The layout below uses <code>.container</code>, <code>.row</code>, and <code>.col-*</code> classes in a simple way.</p>
    <div class="row">
      <div class="col-12 col-sm-6 col-lg-4 mb-3">
        <div class="p-3 bg-white border rounded">Uses <code>col-12</code> for mobile.</div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 mb-3">
        <div class="p-3 bg-white border rounded">Uses <code>col-sm-6</code> for tablets.</div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4 mb-3">
        <div class="p-3 bg-white border rounded">Uses <code>col-lg-4</code> for desktops.</div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
